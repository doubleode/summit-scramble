<title>Summit Scramble</title>

<style>
/* Layout: one full-window pixel canvas, letterboxed and integer-scaled. Single committed night palette. */
:root{
  --night:#0b0c26;
  --ink:#eef0ff;
  --snow:#c9d1f5;
  --font-pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --pad-fill:rgba(20,24,70,.42);
  --pad-edge:rgba(201,209,245,.5);
  --pad-on:rgba(201,209,245,.38);
  --jump:rgba(238,70,85,.5);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
body.touch #wrap,body.touch #touch{touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--night)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;outline:none;touch-action:none}
canvas:focus-visible{outline:2px solid var(--snow);outline-offset:2px}
/* touch controls: only shown on phones and tablets */
body.touch{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body.touch.portrait #wrap{align-items:flex-start;padding-top:max(8px,env(safe-area-inset-top))}
#touch{position:fixed;inset:0;pointer-events:none;z-index:5;font-family:var(--font-pixel)}
.tc{pointer-events:auto;position:absolute;display:flex;align-items:center;justify-content:center;box-sizing:border-box;color:var(--ink);background:var(--pad-fill);border:2px solid var(--pad-edge);border-radius:50%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-size:9px;letter-spacing:.04em}
.tc.on{background:var(--pad-on);border-color:var(--ink)}
#pad{left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:158px;height:120px;border-radius:26px}
#pad i{position:absolute;width:0;height:0;border:13px solid transparent;opacity:.75}
#pad .l{left:14px;top:34px;border-right:18px solid var(--ink);border-left:0}
#pad .r{right:14px;top:34px;border-left:18px solid var(--ink);border-right:0}
#pad .d{left:66px;bottom:8px;border-top:15px solid var(--ink);border-bottom:0;border-width:15px 13px 0}
#pad i.on{opacity:1;filter:drop-shadow(0 0 4px var(--ink))}
#pad span{position:absolute;bottom:12px;left:14px;font-size:7px;opacity:.6}
#bJump{right:max(16px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:84px;height:84px;background:var(--jump);font-size:10px}
#bShove{right:calc(max(16px,env(safe-area-inset-right)) + 94px);bottom:max(14px,env(safe-area-inset-bottom));width:62px;height:62px}
#pad i.run{filter:drop-shadow(0 0 6px #7cf09a);border-left-color:#7cf09a;border-right-color:#7cf09a}
#bMenu{top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:44px;height:34px;border-radius:10px;font-size:10px}
body[data-ui=menu] .tc{display:none}
body[data-ui=play] #rotHint{display:none}
body[data-ui=lobby] #bShove,body[data-ui=lobby] #bMenu{display:none}
body[data-ui=other] #pad,body[data-ui=other] #bShove,body[data-ui=other] #bJump{display:none}
#nameBox{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(7,8,28,.72);font-family:var(--font-pixel);padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
#nameBox[hidden]{display:none}
#nameForm{display:flex;flex-direction:column;gap:14px;align-items:stretch;background:var(--night);border:2px solid var(--snow);padding:22px 20px;width:min(340px,100%);box-sizing:border-box;box-shadow:0 0 0 4px rgba(58,66,144,.6)}
#nameForm label{font-size:12px;color:var(--ink);text-align:center;letter-spacing:.06em}
#nameForm p{margin:0;font-size:8px;line-height:1.7;color:var(--snow);opacity:.8;text-align:center}
#nameIn{font:16px var(--font-pixel);text-transform:uppercase;text-align:center;letter-spacing:.12em;color:var(--ink);background:#141947;border:2px solid #4a54a8;padding:12px 8px;outline:none;border-radius:0;-webkit-user-select:text;user-select:text}
#nameIn:focus{border-color:#ffd23f}
#nameForm button{font:12px var(--font-pixel);color:var(--ink);background:#ee4655;border:0;border-bottom:3px solid #a82a3a;padding:12px;cursor:pointer;letter-spacing:.08em}
#nameForm button:focus-visible{outline:2px solid #ffd23f;outline-offset:2px}
#rotHint{position:absolute;left:0;right:0;text-align:center;font-size:8px;color:var(--snow);opacity:.7;pointer-events:none;line-height:1.6;padding:0 16px}
</style>

function parseChunk(src){
  const cave=typeof src==='object'&&src.cave;if(typeof src==='object')src=src.src;
  const lines=src.trim().split('\n').map(s=>s.trim());
  const w=Math.max(...lines.map(l=>l.length));
  const rows=Array.from({length:ROWS},()=>Array(w).fill('.'));
  const top=19-lines.length;
  lines.forEach((l,i)=>{for(let c=0;c<w;c++)rows[top+i][c]=l[c]||'.';});
  for(let r=19;r<ROWS;r++)for(let c=0;c<w;c++){const t=rows[18][c];rows[r][c]=(t==='#'||t==='='||t==='I')?'#':'.';}
  // cave chunks: open cells under the rock are drawn as dark cave interior
  const cv=rows.map(r=>r.map(()=>0));
  if(cave)for(let c=0;c<w;c++){let under=false;for(let r=0;r<ROWS;r++){const t=rows[r][c];if('#=/\\'.includes(t))under=true;else if(under&&!'#=IC'.includes(t))cv[r][c]=1;}}
  return {w,rows,cv};
}

const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function hash(a,b){let h=(a*374761393+b*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  if(amt<0){r*=1+amt;g*=1+amt;b*=1+amt}else{r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}
  return `rgb(${r|0},${g|0},${b|0})`;}
const ovr=(ax,ay,aw,ah,bx,by,bw,bh)=>ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
const ov=(a,b)=>ovr(a.x,a.y,a.w,a.h,b.x,b.y,b.w,b.h);

let AC=null,muted=false;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
function tone(f0,f1,dur,type='square',vol=0.04,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+dur+0.02);}
function noise(dur,vol=0.05){if(!AC||muted)return;const len=Math.max(1,AC.sampleRate*dur|0);const b=AC.createBuffer(1,len,AC.sampleRate);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const gn=AC.createGain();gn.gain.value=vol;s.connect(gn).connect(AC.destination);s.start();}

function resize(){const dpr=window.devicePixelRatio||1;

    if(p&&state!=='lobby'){o.s=[Math.round(p.x*10),Math.round(p.y*10),Math.round(p.vx),Math.round(p.vy),pbits(p),Math.round(num(p.stam,1)*10)];o.n=[p.sc|0,p.dc|0,p.spawnSeq|0,curRid,p.djc|0,p.wjc|0];}

function netTick(dt){

function moverX(m,t){const d=m.x1-m.x0;if(d<=0)return m.x0;const ph=((t*28)%(2*d)+2*d)%(2*d);return m.x0+(ph<d?ph:2*d-ph);}
function updateMovers(){for(const m of movers){const nx=moverX(m,wt);m.dx=nx-m.x;m.x=nx;}}

// ============================================================ collisions
function tileAt(c,r){if(c<0||c>=LW)return '#';if(r<0||r>=ROWS)return '.';return grid[r][c];}
function crumbleGone(c,r){const s=crumbles.get(r*LW+c);return !!(s&&s.gone);}
function solidTile(c,r){const t=tileAt(c,r);if(t==='#'||t==='='||t==='I')return true;if(t==='C')return !crumbleGone(c,r);return false;}
function tilesSolid(x,y,w,h){const c0=Math.floor(x/T),c1=Math.floor((x+w-0.001)/T),r0=Math.floor(y/T),r1=Math.floor((y+h-0.001)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(solidTile(c,r))return true;return false;}
function rectSolid(x,y,w,h){if(tilesSolid(x,y,w,h))return true;
  for(const gt of gates)if(gt.solidBottom>gt.top&&ovr(x,y,w,h,gt.x,gt.top,6,gt.solidBottom-gt.top))return true;
  return false;}
function oneWay(e,ny){const ob=e.y+e.h,nb=ny+e.h;
  const c0=Math.floor(e.x/T),c1=Math.floor((e.x+e.w-0.001)/T);
  for(let r=Math.floor(ob/T);r<=Math.floor(nb/T);r++){const top=r*T;if(ob<=top+0.01&&nb>top){for(let c=c0;c<=c1;c++)if(tileAt(c,r)==='-')return{top,m:null};}}
  for(const m of movers)if(e.x+e.w>m.x&&e.x<m.x+m.w&&ob<=m.y+0.01&&nb>m.y)return{top:m.y,m};
  return null;}
// slopes: '/' rises to the right, '\' falls to the right; ground is found under the body's centre
const isSlope=t=>t==='/'||t==='\\';
function slopeY(c,r,px){const l=clamp(px-c*T,0,T);return tileAt(c,r)==='/'?r*T+T-l:r*T+l;}
function slopeSurf(cx,y0,y1){const c=Math.floor(cx/T);for(let r=Math.floor(y0/T);r<=Math.floor(y1/T);r++){if(isSlope(tileAt(c,r))){const sy=slopeY(c,r,cx);if(sy>=y0-0.01&&sy<=y1)return sy;}}return null;}
function slopeType(e){const cx=e.x+e.w/2,f=e.y+e.h;const c=Math.floor(cx/T);for(let r=Math.floor((f-2)/T);r<=Math.floor((f+1)/T);r++){const t=tileAt(c,r);if(isSlope(t)&&Math.abs(slopeY(c,r,cx)-f)<2)return t;}return null;}
function bodySolid(e,x,y){const onS=slopeSurf(x+e.w/2,y+e.h-6,y+e.h+2)!=null;return rectSolid(x,y,e.w,onS?e.h-4:e.h);}
function moveX(e,dx){let rem=dx;const grounded=e.onGround;while(Math.abs(rem)>1e-6){const s=Math.abs(rem)>1?Math.sign(rem):rem;
    if(bodySolid(e,e.x+s,e.y)){let k=0;if(grounded)for(let u=0.5;u<=4;u+=0.5){if(!bodySolid(e,e.x+s,e.y-u)){k=u;break;}}if(!k)return true;e.y-=k;}
    e.x+=s;rem-=s;
    if(grounded){const sy=slopeSurf(e.x+e.w/2,e.y+e.h-5,e.y+e.h+5);if(sy!=null&&!rectSolid(e.x,sy-e.h,e.w,e.h-4))e.y=sy-e.h;}}return false;}
function moveY(e,dy){let rem=dy;while(Math.abs(rem)>1e-6){const s=Math.abs(rem)>1?Math.sign(rem):rem;
    if(s>0){const sy=slopeSurf(e.x+e.w/2,e.y+e.h-0.01,e.y+e.h+s);if(sy!=null){e.y=sy-e.h;return true;}}
    if(bodySolid(e,e.x,e.y+s))return true;
    if(s>0&&!(e.dropT>0)){const o=oneWay(e,e.y+s);if(o){e.y=o.top-e.h;if(o.m)e.groundRef=o.m;return true;}}
    e.y+=s;rem-=s;}return false;}
function onOneWay(p){if(rectSolid(p.x,p.y+1,p.w,p.h))return false;const r=Math.floor((p.y+p.h+0.5)/T);const c0=Math.floor(p.x/T),c1=Math.floor((p.x+p.w-0.001)/T);for(let c=c0;c<=c1;c++)if(tileAt(c,r)==='-')return true;return !!p.groundRef;}
function onIce(p){const r=Math.floor((p.y+p.h+0.5)/T);const c0=Math.floor(p.x/T),c1=Math.floor((p.x+p.w-0.001)/T);for(let c=c0;c<=c1;c++)if(tileAt(c,r)==='I')return true;return false;}
function hazardAt(x,y,w,h){const c0=Math.floor(x/T)-1,c1=Math.floor((x+w)/T)+1,r0=Math.floor(y/T),r1=Math.floor((y+h)/T)+1;for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(tileAt(c,r)==='^')return true;return enemies.some(e=>!e.dead&&e.active&&ovr(x-12,y-8,w+24,h+16,e.x,e.y,e.w,e.h));}
function safeCol(c,footRow,up=4){for(let r=Math.max(0,footRow-up);r<ROWS;r++){const t=tileAt(c,r);if(solidTile(c,r)||t==='-'||isSlope(t))return tileAt(c,r-1)!=='^';}return false;}

    case 13:if(!mine)for(let i=0;i<4;i++)parts.push({x,y:y+rnd(-3,3),vx:rnd(-30,30),vy:rnd(-10,10),life:0.3,max:0.3,col:'#c9d1f5',g:0,s:1});break;

function dropCoins(p,n){n=Math.min(n,p.coins);p.coins-=n;for(let i=0;i<n;i++)dropped.push({x:p.x+1,y:p.y+2,w:4,h:4,vx:rnd(-70,70),vy:rnd(-190,-120),delay:0.5,life:7,t:0});}

  if(NET==='client'){p.dead=true;p.deathT=TG;p.deadT=OPT.resp;p.dc++;p.sliding=false;fxLocal(3,p.x+3,p.y+5,p.slot);}else die(p,cause);}

function safeSpot(){const base=Math.floor((camX+PW*0.4)/T);
  for(let k=0;k<34;k++)for(const c of (k?[base-k,base+k]:[base])){if(c*T<camX+8||c*T>camX+PW-16)continue;
    for(let r=3;r<ROWS;r++){if(isSlope(tileAt(c,r)))break;if(solidTile(c,r)){if(!solidTile(c,r-1)&&!solidTile(c,r-2)&&tileAt(c,r)!=='C'&&tileAt(c,r-1)!=='^'&&tileAt(c,r-1)!=='S'){const x=c*T+1,y=r*T-10;if(!rectSolid(x,y,6,10)&&!hazardAt(x,y,6,10))return{x,y};}break;}}}
  return lastCP?{x:lastCP.x,y:lastCP.bottom-10}:null;}
function tryRespawn(p){

  for(let i=0;i<3;i++)parts.push({x:hb.x+(p.face>0?8:4),y:p.y+5+rnd(-2,2),vx:p.face*rnd(40,90),vy:rnd(-10,10),life:0.18,max:0.18,col:'#eef0ff',g:0,s:1});
  if(p.ctl!=='remote')p.vx=clamp(p.vx+p.face*50,-150,150);}
function finish(p){p.finished=true;p.place=++finishCount;p.vx=0;p.ai.plate=null;p.ftime=roundT;p.best=p.best?Math.min(p.best,roundT):roundT;SFX.finish();burst(p.x+3,p.y,p.color,20,90,0.9,100);
  toast(labelOf(p)+' FINISHED '+ord(p.place)+'!',p.color);pushEv(p.slot,'f',p.place);if(hurryT<0&&players.some(q=>!q.finished)){hurryT=15;}}

// ============================================================ bots
function botInput(p,dt){
  const ai=p.ai,out={x:0,jump:false,down:false,act:false,run:false};
  if(p.dead||p.finished||state!=='play'){ai.jh=0;return out;}
  const cx=p.x+p.w/2,foot=p.y+p.h,footRow=Math.floor((foot+1)/T);
  let mx=1,jumpNow=false;
  let gate=null;for(const gt of gates){if(gt.open<0.6&&!gt.forced&&gt.x>p.x&&gt.x-p.x<80){gate=gt;break;}}
  if(ai.plate){const pl=ai.plate,gt=ai.plateGate;const dx=(pl.x+4)-cx;mx=Math.abs(dx)>1.5?Math.sign(dx):0;ai.holdT+=dt;
    if(mx!==0&&p.onGround&&pl.y<foot-6&&Math.abs(dx)<26)jumpNow=true;
    const waiting=players.some(q=>q!==p&&!q.dead&&!q.finished&&q.x<gt.x&&q.x>pl.x+10&&!(q.ai&&q.ai.plate));
    const past=players.some(q=>q!==p&&!q.dead&&q.x>gt.x+8);
    if((past&&!waiting&&ai.holdT>1.2)||ai.holdT>8||p.x>gt.x){ai.done[gt.id]='went';ai.plate=null;}
  }else if(gate){
    if(ai.done[gate.id]===undefined)ai.done[gate.id]=Math.random()<ai.helpful?'help':'wait';
    if(ai.done[gate.id]==='wait'){ai.waitT+=dt;if(ai.waitT>4){ai.done[gate.id]='help';ai.waitT=0;}}

  let hazardNear=false;
  if(mx!==0&&p.onGround&&!p.groundRef){const dir=mx;
    if(bodySolid(p,p.x+dir*3,p.y-1))jumpNow=true;
    const look=6+Math.max(0,Math.abs(p.vx)-RUN)*0.12;const ac=Math.floor((dir>0?p.x+p.w+look:p.x-look)/T);
    let hz=!safeCol(ac,footRow,1);

    if(hz){let gw=0;for(let k=0;k<9;k++){if(safeCol(ac+dir*k,footRow))break;gw++;}

// ============================================================ client mirror
function applySnap(s){

    curRid=rid;buildLevel(s.seed);
    const oldP=players;players=[];
    slots.forEach((sl,i)=>{if(sl.type==='open')return;const mine=sl.type==='remote'&&sl.peer===myPeer&&!!myJoin[sl.dev];const prev=oldP.find(q=>q.slot===i);
      const p=makePlayer(i,mine?'local':'mirror');if(prev){p.sc=prev.sc;p.dc=prev.dc;}players.push(p);});
    players.forEach((p,i)=>resetPlayer(p,i));camX=0;camTarget=0;wt=num(s.wt);lastTick=-1;

  const swt=num(s.wt);if(Math.abs(swt-wt)>0.3)wt=swt;else wt+=(swt-wt)*0.2;

    p.ftime=num(a[16])/10;p.best=num(a[17])/10;p.hat=num(a[18]);p.nextHat=num(a[19]);

      p.wallSliding=!!(bits&16);p.sprinting=!!(bits&32);if(p.dead&&!(bits&64))p.rx=null;p.dead=!!(bits&64);p.finished=!!(bits&128);p.invuln=(bits&256)?1:0;p.stun=num(a[12])/10;p.stam=num(a[13],10)/10;
      p.sliding=!!(bits&4096);if((bits&1024)&&TG-(p.djT||-9)>0.3)p.djT=TG;}

  if(Array.isArray(s.en))enemies.forEach((e,i)=>{const x=s.en[i*3],y=s.en[i*3+1],f=num(s.en[i*3+2]);if(x===undefined)return;e.x=num(x);e.y=num(y);e.dir=(f&4)?1:-1;e.active=!!(f&8);e.dead=!!(f&1);e.deadT=(f&2)?0.2:0;});

function processEvents(events){
  events.sort((a,b)=>a[0]-b[0]);

      case 'b':if(mine&&!p.dead&&TG-(p.predT||-9)>0.3){p.vy=a;p.varJump=false;}break;
      case 'd':if(p){if(mine){if(!p.dead){p.dead=true;p.deathT=TG;p.deadT=OPT.resp;fxLocal(3,p.x+3,p.y+5,to);}}else fxLocal(3,a,b,to);}break;

      case 'f':if(p){if(mine){p.finished=true;p.place=a;}SFX.finish();toast(labelOf(p)+' FINISHED '+ord(a)+'!',p.color);}break;

    }}}

// ============================================================ update
function tick(dt){
  TG+=dt;if(!nameBox.hidden){keyEdge=Object.create(null);clicks=[];if(state==='menu'||state==='lobby'){menuCam+=dt*14;if(NET!=='off')netTick(dt);return;}}
  pollInput();
  if(keyEdge.KeyM){muted=!muted;toast(muted?'SOUND OFF':'SOUND ON');}
  if(NET!=='off')netTick(dt);
  if(state==='menu')updateMenu(dt);
  else if(state==='lobby'){if(NET==='client')clientLobby(dt);else updateLobby(dt);}
  else if(state==='pause'){if(keyEdge.Escape)state=prevState;else if(keyEdge.KeyQ){state='menu';}runClicks();}
  else if(escMenu){if(keyEdge.Escape)escMenu=false;else if(keyEdge.KeyQ){escMenu=false;if(NET!=='off')leaveOnline();else state='menu';}
    else{runClicks();if(NET==='client')clientGame(dt);else if(state==='intro'||state==='play')updateGame(dt);else updateParts(dt);}}
  else if(state==='results'){resultsT+=dt;updateParts(dt);
    if(NET!=='client'){const allCpu=players.every(p=>p.ctl!=='local');if((resultsT>1.5&&anyContinue())||(allCpu&&resultsT>6)||(NET==='host'&&resultsT>9)){if(roundNo>=rounds){state='final';resultsT=0;}else startRound();}}
    if(keyEdge.Escape)escMenu=true;}
  else if(state==='final'){resultsT+=dt;if(Math.random()<0.5)parts.push({x:rnd(0,W),y:-4,vx:rnd(-20,20),vy:rnd(20,50),life:4,max:4,col:COLORS[Math.random()*12|0][1],g:20,s:2});updateParts(dt);
    if(NET!=='client'&&((resultsT>2&&anyContinue())||(NET==='host'&&resultsT>12))){state='lobby';players=[];grid=[];}
    if(keyEdge.Escape)escMenu=true;}
  else{if(keyEdge.Escape){if(NET==='off'){prevState=state;state='pause';}else escMenu=true;}else if(NET==='client')clientGame(dt);else updateGame(dt);}
  for(const t of toasts)t.t-=dt;toasts=toasts.filter(t=>t.t>0);
  keyEdge=Object.create(null);clicks=[];
}
function updateMenu(dt){menuCam+=dt*14;runClicks();if(keyEdge.Enter&&state==='menu'){state='lobby';NET='off';resetSlots();}}
function updateLobby(dt){
  menuCam+=dt*14;runClicks();if(state!=='lobby')return;
  for(const id of devIds){const d=DEV[id];if(!d)continue;const si=slots.findIndex(s=>s.type==='human'&&s.dev===id);
    if(si<0){if(d.jp){let t=slots.findIndex(s=>s.type==='open');if(t<0)t=slots.findIndex(s=>s.type==='cpu');if(t>=0){setSlot(t,'human',id);SFX.blip();}}}
    else{if(d.lp)cycleColor(si,-1);if(d.rp)cycleColor(si,1);if(d.ap){setSlot(si,'open');SFX.blip();}if(d.sp)tryStart();}}
  if(keyEdge.Enter)tryStart();
  else if(keyEdge.Escape){if(NET==='host')leaveOnline();else state='menu';}
}
function clientLobby(dt){
  menuCam+=dt*14;runClicks();if(state!=='lobby'||NET!=='client')return;
  const taken=(dev)=>slots.filter(s=>s.type!=='open'&&!(s.type==='remote'&&s.peer===myPeer&&s.dev===dev)).map(s=>s.color);
  for(const id of devIds){const d=DEV[id];if(!d)continue;
    if(!myJoin[id]){if(d.jp){const tk=taken(id);let c=0;while(tk.includes(c)&&c<11)c++;myJoin[id]={col:c,nm:Object.values(myJoin).some(j=>j.nm===myName)?'':myName};SFX.blip();}}
    else{const step=d.lp?-1:d.rp?1:0;if(step)stepMyColor(id,step);

function stepMyColor(dev,step){if(!myJoin[dev])return;const tk=slots.filter(s=>s.type!=='open'&&!(s.type==='remote'&&s.peer===myPeer&&s.dev===dev)).map(s=>s.color);

function updateParts(dt){for(const q of parts){q.life-=dt;q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}parts=parts.filter(q=>q.life>0);}
function readInputs(dt){for(const p of players){let raw;if(p.ctl==='cpu')raw=botInput(p,dt);else if(p.ctl==='local')raw=DEV[p.dev]?DEV[p.dev].cur:ZERO;else continue;
  p.inp={x:raw.x,jump:raw.jump,down:raw.down,act:raw.act,run:raw.run,jp:raw.jump&&!p.prevJ,ap:raw.act&&!p.prevA};p.prevJ=raw.jump;p.prevA=raw.act;}}

function updateGame(dt){

  wt+=dt;if(state==='play')roundT+=dt;
  readInputs(dt);
  updateMovers();
  for(const p of players)if(!p.dead&&p.ctl!=='remote'&&p.groundRef&&p.groundRef.dx)moveX(p,p.groundRef.dx);
  for(const e of enemies)if(!e.dead&&e.groundRef&&e.groundRef.dx)moveX(e,e.groundRef.dx);

  if(state==='play'){
    if(hurryT<0&&roundT>150){hurryT=20;toast('HURRY UP!','#ff6b6b');}
    if(hurryT>=0){hurryT-=dt;const n=Math.ceil(hurryT);if(n!==lastTick&&n<=5&&n>0){SFX.tick();lastTick=n;}if(hurryT<=0)endRound();}

function hostPlayer(p,dt){

  if(p.ctl==='remote'){for(const k of TIMERS)if(p[k]>0)p[k]-=dt;p.anim+=dt;}
  else simPlayer(p,dt);
  if(p.dead)return;
  if(!p.finished&&flag&&ovr(p.x,p.y,p.w,p.h,flag.x-1,flag.top,4,flag.bottom-flag.top))finish(p);
  if(p.onGround){const r=Math.floor((p.y+p.h+0.5)/T);for(let c=Math.floor(p.x/T);c<=Math.floor((p.x+p.w-0.01)/T);c++)if(tileAt(c,r)==='C')triggerCrumble(c,r);}
}
function clientGame(dt){
  if(state==='intro'){const n=Math.ceil(introT);introT-=dt;if(n!==lastTick&&n>0&&n<=3){SFX.tick();lastTick=n;}}
  if(state==='play'&&hurryT>0){const n=Math.ceil(hurryT);hurryT-=dt;if(n!==lastTick&&n<=5&&n>0){SFX.tick();lastTick=n;}}
  if(state==='intro'||state==='play')wt+=dt;if(state==='play')roundT+=dt;
  if(Math.abs(camTarget-camX)>200)camX=camTarget;else camX+=(camTarget-camX)*Math.min(1,dt*8);
  readInputs(dt);updateMovers();
  for(const p of players){
    if(p.ctl==='local'){if(p.dead){if(p.deadT>0)p.deadT=Math.max(0,p.deadT-dt);continue;}if(p.groundRef&&p.groundRef.dx)moveX(p,p.groundRef.dx);simPlayer(p,dt);}
    else{p.anim+=dt;if(p.dead&&p.deadT>0)p.deadT=Math.max(0,p.deadT-dt);if(p.stun>0)p.stun-=dt;}
  }
  for(const e of enemies)e.t+=dt;
  for(const c of fixedCoins)c.t+=dt;

}
// physics for a player simulated on this machine
function simPlayer(p,dt){

let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;acc+=dt;let n=0;while(acc>=STEP&&n<6){tick(STEP);acc-=STEP;n++;}if(n===6)acc=0;render();requestAnimationFrame(frame);}
